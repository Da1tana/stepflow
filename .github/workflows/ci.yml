name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate, unit and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate manifest, permissions, paths, i18n
        run: npm run validate

      - name: Unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build clean extension folder
        run: npm run pack

      - name: E2E tests in Chromium (packed build)
        run: npm run test:e2e
        env:
          EXTENSION_DIR: dist/stepflow

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          if-no-files-found: ignore

      - name: Upload extension build
        uses: actions/upload-artifact@v4
        with:
          name: stepflow-extension
          path: dist/stepflow/
