<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StepFlow</title>
    <link rel="stylesheet" href="../shared/styles/tokens.css" />
    <link rel="stylesheet" href="../shared/styles/base.css" />
    <link rel="stylesheet" href="../shared/styles/components.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <div class="sf-brand">
          <span class="sf-logo" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.5 12.5h3.5v-3.5h3.5v-3.5h4" />
            </svg>
          </span>
          StepFlow
        </div>
        <span class="sf-badge" id="status" role="status" aria-live="polite">
          <span class="sf-dot" aria-hidden="true"></span>
          <span id="status-message" data-i18n="statusReady"></span>
        </span>
      </header>

      <p class="popup__tagline sf-muted" data-i18n="popupTagline"></p>

      <section class="popup__actions">
        <button class="sf-btn sf-btn--primary sf-btn--lg sf-btn--block" id="start-recording" type="button" disabled>
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="8" cy="8" r="4.5" /></svg>
          <span data-i18n="startRecording"></span>
        </button>
        <button class="sf-btn sf-btn--block" id="open-panel" type="button" disabled>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="2" y="2.5" width="12" height="11" rx="2" />
            <path d="M10 2.5v11" />
          </svg>
          <span data-i18n="openPanel"></span>
        </button>
      </section>

      <section class="sf-stats" aria-live="polite">
        <div class="sf-card sf-stat">
          <div class="sf-stat__value" id="guides-count">0</div>
          <div class="sf-stat__label" data-i18n="statGuides"></div>
        </div>
        <div class="sf-card sf-stat">
          <div class="sf-stat__value" id="steps-count">0</div>
          <div class="sf-stat__label" data-i18n="statSteps"></div>
        </div>
      </section>

      <footer class="popup__footer sf-subtle">
        <span><span data-i18n="shortcutHint"></span> <kbd class="sf-kbd">Alt</kbd> <kbd class="sf-kbd">Shift</kbd> <kbd class="sf-kbd">S</kbd></span>
        <span id="version"></span>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
