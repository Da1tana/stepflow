<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StepFlow</title>
    <link rel="stylesheet" href="../shared/styles/tokens.css" />
    <link rel="stylesheet" href="../shared/styles/base.css" />
    <link rel="stylesheet" href="../shared/styles/components.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="panel">
      <header class="panel__header">
        <div class="sf-brand">
          <span class="sf-logo" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.5 12.5h3.5v-3.5h3.5v-3.5h4" />
            </svg>
          </span>
          StepFlow
        </div>
        <span class="sf-badge">
          <span class="sf-dot" aria-hidden="true"></span>
          <span data-i18n="statusReady"></span>
        </span>
      </header>

      <nav class="sf-tabs" role="tablist">
        <button class="sf-tab" role="tab" type="button" data-view="guides" aria-selected="true" aria-controls="view-guides" data-i18n="navGuides"></button>
        <button class="sf-tab" role="tab" type="button" data-view="settings" aria-selected="false" aria-controls="view-settings" data-i18n="navSettings"></button>
      </nav>

      <main class="panel__body">
        <!-- View: guides -->
        <section class="view" id="view-guides" role="tabpanel" data-view="guides">
          <section class="sf-card recording-card" id="recording-card" hidden aria-live="polite">
            <div class="recording-card__header">
              <div>
                <h2 data-i18n="recordingTitle"></h2>
                <p class="sf-muted" id="recording-status"></p>
              </div>
              <span class="sf-badge" id="recording-count">0</span>
            </div>
            <ol class="recording-steps" id="recording-steps"></ol>
            <div class="recording-actions">
              <button class="sf-btn sf-btn--primary" id="stop-recording" type="button" data-i18n="finishRecording"></button>
              <button class="sf-btn" id="cancel-recording" type="button" data-i18n="cancelRecording"></button>
            </div>
            <p class="recording-error" id="recording-error" role="alert" hidden></p>
          </section>
          <ul class="guide-list" id="guide-list" hidden></ul>

          <div class="empty" id="empty-state">
            <div class="empty__art" aria-hidden="true">
              <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="9" width="36" height="30" rx="5" />
                <path d="M6 16h36" />
                <path d="M15 32h5v-5h5v-5h8" />
              </svg>
            </div>
            <h2 data-i18n="emptyTitle"></h2>
            <p class="sf-muted" data-i18n="emptyText"></p>
            <button class="sf-btn sf-btn--primary sf-btn--lg sf-btn--block" type="button" disabled>
              <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="8" cy="8" r="4.5" /></svg>
              <span data-i18n="startRecording"></span>
              <span class="sf-badge" data-i18n="comingSoon"></span>
            </button>
          </div>

          <div class="how">
            <h3 class="how__title" data-i18n="howItWorks"></h3>
            <ol class="how__steps">
              <li class="sf-card how__step">
                <span class="how__num">01</span>
                <div><strong data-i18n="step1Title"></strong><p class="sf-muted" data-i18n="step1Text"></p></div>
              </li>
              <li class="sf-card how__step">
                <span class="how__num">02</span>
                <div><strong data-i18n="step2Title"></strong><p class="sf-muted" data-i18n="step2Text"></p></div>
              </li>
              <li class="sf-card how__step">
                <span class="how__num">03</span>
                <div><strong data-i18n="step3Title"></strong><p class="sf-muted" data-i18n="step3Text"></p></div>
              </li>
            </ol>
          </div>
        </section>

        <!-- View: settings -->
        <section class="view" id="view-settings" role="tabpanel" data-view="settings" hidden>
          <div>
            <h2 class="view__title" data-i18n="settingsTitle"></h2>
            <p class="sf-muted" data-i18n="settingsText"></p>
          </div>
          <form class="sf-card" id="settings-form">
            <label class="sf-switch">
              <span data-i18n="settingAutoScreenshot"></span>
              <input type="checkbox" name="autoScreenshot" />
            </label>
            <label class="sf-switch">
              <span data-i18n="settingHighlightClicks"></span>
              <input type="checkbox" name="highlightClicks" />
            </label>
          </form>
        </section>
      </main>

      <footer class="panel__footer sf-subtle">
        <span class="panel__privacy">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="3" y="7" width="10" height="7" rx="2" />
            <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" />
          </svg>
          <span data-i18n="localOnly"></span>
        </span>
        <span id="version" class="panel__version"></span>
      </footer>
    </div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
